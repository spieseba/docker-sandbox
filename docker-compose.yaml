services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: Europe/Berlin
        ZSH_IN_DOCKER_VERSION: 1.2.0
    volumes:
      - ./workspace:/home/agent/workspace:rw
      - ~/.claude:/home/agent/.claude:rw
      - ~/.claude.json:/home/agent/.claude.json:rw
      - ~/.codex:/home/agent/.codex:rw 
    stdin_open: true
    tty: true
    command: zsh 
