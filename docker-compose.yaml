services:
  docker-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: Europe/Berlin
        CLAUDE_CODE_VERSION: latest
        CODEX_VERSION: latest
        #GEMINI_VERSION: latest
        ZSH_IN_DOCKER_VERSION: 1.2.0
    
    container_name: sandbox
    
    cap_add:
      - NET_ADMIN
      - NET_RAW
        
    volumes:
      # Mount current project - CHANGE PATH AS NEEDED!
      #- ./test-project:/workspace:rw
      - /Users/sebastian/Projects/WebDev/Webpage:/workspace:rw
      # Mount persistent host configs for CLIs
      ## Claude Code
      - ~/.claude:/home/ubuntu/.claude
      - ~/.claude.json:/home/ubuntu/.claude.json
      ## Codex CLI
      - ~/.codex:/home/ubuntu/.codex:rw
      ## Gemini CLI
      #- ~/.gemini:/home/ubuntu/.gemini:rw

    working_dir: /workspace
    
    stdin_open: true
    tty: true
    
    command: >
      bash -c "
      sudo /usr/local/bin/init-firewall.sh &&
      exec zsh
      "
