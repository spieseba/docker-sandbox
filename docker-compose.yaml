services:
  sandbox-base: &sandbox-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: Europe/Berlin
        CLAUDE_CODE_VERSION: latest
        CODEX_VERSION: latest
        GEMINI_VERSION: latest
        ZSH_IN_DOCKER_VERSION: 1.2.0

    volumes:
      # Mount current project - CHANGE PATH AS NEEDED!
      - ./test-project:/workspace:rw
      # Mount persistent host configs for CLIs
      ## Claude Code
      - ~/.claude:/home/ubuntu/.claude
      - ~/.claude.json:/home/ubuntu/.claude.json
      ## Codex CLI
      - ~/.codex:/home/ubuntu/.codex:rw
      ## Gemini CLI
      - ~/.gemini:/home/ubuntu/.gemini:rw

    working_dir: /workspace
    
    stdin_open: true
    tty: true
    
  # service WITHOUT firewall
  sandbox-open:
    <<: *sandbox-base
    container_name: sandbox-open
    command: zsh

  # service WITH firewall
  sandbox-closed:
    <<: *sandbox-base
    container_name: sandbox-closed
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "sudo /usr/local/bin/init-firewall.sh && exec zsh" 
